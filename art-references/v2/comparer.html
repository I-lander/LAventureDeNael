<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Choisir les modèles</title>
<style>
body { background: #1a1424; color: #f4f2ea; font-family: sans-serif; margin: 16px; }
h1 { font-size: 22px; }
h2 { font-size: 18px; margin: 28px 0 8px; color: #f8d880; }
.row { display: flex; gap: 12px; flex-wrap: wrap; }
figure { margin: 0; flex: 1 1 420px; }
figcaption { font-weight: bold; font-size: 20px; margin-bottom: 4px; }
img { width: 100%; image-rendering: pixelated; border: 2px solid #3a6150; }
.style img { width: auto; max-width: 100%; }
</style>
</head>
<body>
<h1>Choisis A ou B pour chaque planche</h1>
<h2>Le style du jeu aujourd'hui (pour comparer)</h2>
<div class="row style">
<img src="input/style-characters.png" alt="personnages actuels">
<img src="input/style-world.png" alt="décor actuel">
</div>
<h2>1. Squelette et champignon</h2>
<div class="row"><figure><figcaption>A</figcaption><img src="monsters-a-a.jpg"></figure><figure><figcaption>B</figcaption><img src="monsters-a-b.jpg"></figure></div>
<h2>2. Chauve-souris, golem de lave, pièces</h2>
<div class="row"><figure><figcaption>A</figcaption><img src="monsters-b-a.jpg"></figure><figure><figcaption>B</figcaption><img src="monsters-b-b.jpg"></figure></div>
<h2>3. Villageois</h2>
<div class="row"><figure><figcaption>A</figcaption><img src="villagers-a.jpg"></figure><figure><figcaption>B</figcaption><img src="villagers-b.jpg"></figure></div>
<h2>4. Maisons</h2>
<div class="row"><figure><figcaption>A</figcaption><img src="houses-a.jpg"></figure><figure><figcaption>B</figcaption><img src="houses-b.jpg"></figure></div>
<h2>5. Décor de village</h2>
<div class="row"><figure><figcaption>A</figcaption><img src="village-decor-a.jpg"></figure><figure><figcaption>B</figcaption><img src="village-decor-b.jpg"></figure></div>
<h2>6. Objets à casser</h2>
<div class="row"><figure><figcaption>A</figcaption><img src="breakables-a.jpg"></figure><figure><figcaption>B</figcaption><img src="breakables-b.jpg"></figure></div>
<h2>7. Désert et marais</h2>
<div class="row"><figure><figcaption>A</figcaption><img src="biomes-a.jpg"></figure><figure><figcaption>B</figcaption><img src="biomes-b.jpg"></figure></div>
</body>
</html>
